name: PHP Lint

on:
  push:
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_sqlite, curl

      - name: Lint all PHP files
        run: |
          set -e
          status=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file"; then
              status=1
            fi
          done < <(find . -name '*.php' -print0)
          exit $status
